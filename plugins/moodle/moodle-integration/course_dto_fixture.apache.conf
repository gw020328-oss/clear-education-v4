# Test container only; the fixture file stays outside Moodle's DocumentRoot.
<VirtualHost *:80>
    DocumentRoot /var/www/html
    Alias /__course-dto/student.php /probe/course_dto_fixture_page.php
    Alias /__course-dto/teacher.php /probe/course_dto_fixture_page.php
    <Directory /probe>
        Require all denied
        <Files "course_dto_fixture_page.php">
            Require all granted
        </Files>
    </Directory>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
