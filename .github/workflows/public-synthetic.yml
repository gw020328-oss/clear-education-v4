name: Public synthetic CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ['codex/**']

permissions:
  contents: read

concurrency:
  group: public-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-content:
    name: Public content history
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
      - name: Test redacted history scanner
        run: ./tools/node --test tests/public-content.test.mjs
      - name: Scan reachable Git history without printing values
        run: ./tools/node tools/check-public-content.mjs HEAD

  synthetic-tests:
    name: Public synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
      - name: Install pinned dependencies without lifecycle scripts
        run: |
          ./tools/npm ci --ignore-scripts
          ./tools/npm --prefix spikes/w02-proof-adapter ci --ignore-scripts
          ./tools/npm --prefix spikes/w02-collector-boundary ci --ignore-scripts
          ./tools/npm --prefix src/ybm-collector ci --ignore-scripts
      - name: Check dependencies and compile reference contract in memory
        run: ./tools/npm run verify:dependencies
      - name: Offline proof adapter tests
        run: ./tools/npm --prefix spikes/w02-proof-adapter test
      - name: Synthetic policy compiler and deterministic eligibility
        run: ./tools/npm run test:policy
      - name: Wallet authentication, consent and durable application state
        run: ./tools/npm run test:applications
      - name: Isolated in-memory vault, final consent and funding recovery
        run: ./tools/npm run test:vault
      - name: Product proof sessions, durable nonce and current enrollment
        run: ./tools/npm run test:proof-sessions
      - name: Versioned MVP policy contracts and generic synthetic profiles
        run: ./tools/npm run test:mvp-policy
      - name: M0 contracts and two-stage exam lifecycle examples
        run: ./tools/node specs/m0/check.mjs
      - name: Isolated TEST partial funding, allocation and recovery
        run: ./tools/npm run test:funding-lab
      - name: Synthetic complete exam inventories and highest-score evidence
        run: ./tools/npm run test:exam-evidence
      - name: Product collector, independent verification and atomic result acceptance
        run: ./tools/npm run test:product-proof
      - name: Pinned synthetic learning inventories and provider failure boundaries
        run: ./tools/npm run test:learning-evidence
      - name: Persistent synthetic HTTPS environment and restart isolation
        run: ./tools/npm run test:dev
      - name: Synthetic extraction and isolation tests (loopback only)
        run: ./tools/npm --prefix spikes/w02-collector-boundary test
      - name: Storage preparation tests
        run: ./tools/npm --prefix spikes/w02-storage-preparation test
      - name: YBM route with synthetic attestor and in-memory SDK socket
        run: ./tools/npm --prefix src/ybm-collector test
      - name: Direct proof predicate and adapter feasibility (synthetic only)
        run: |
          ./tools/node --import ./tests/ybm-collector/network-guard.mjs spikes/direct-proof-feasibility/predicate-check.mjs
          ./tools/node --import ./tests/ybm-collector/network-guard.mjs spikes/direct-proof-feasibility/adapter-check.mjs
          ./tools/node --import ./tests/ybm-collector/network-guard.mjs --test spikes/direct-proof-feasibility/record-policy.test.mjs spikes/direct-proof-feasibility/attestor-extension.test.mjs
      - name: Verify original and published document fingerprints and legacy content
        run: ./tools/npm run verify:workspace
      - name: Fresh checkout integrity regression
        run: ./tools/node --test tests/workspace-integrity.test.mjs
      - name: Managed storage and initialization regression (synthetic only)
        run: ./tools/node --test tests/mac-collector/storage.test.mjs tests/mac-collector/startup.test.mjs tests/mac-collector/recovery.test.mjs

  mac-recovery:
    name: Mac synthetic recovery
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
      - name: Confirm Apple Silicon and installed Chrome
        run: |
          ./tools/node -e "if(process.platform!=='darwin'||process.arch!=='arm64')process.exit(1)"
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
      - name: Synthetic Chrome lifecycle and hard-kill recovery
        run: ./tools/node --test tests/mac-collector/*.test.mjs
