name: Explicit self Attestor synthetic rehearsal
on:
  pull_request:
    branches: [develop]
    paths: ['tools/local-attestor-review/**', 'src/hackerrank-evidence/**', 'src/bootcamp/**', 'tools/bootcamp/**', 'tests/hackerrank-evidence/self-*', 'tests/hackathon-test-vault/e5b/**', 'specs/bootcamp/hackathon-test-memory-source-intake-*.json', '.github/workflows/self-attestor-test.yml']
permissions:
  contents: read
concurrency:
  group: self-attestor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    name: Self Attestor HTTPS and isolated V2 100 TEST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.21.0'
      - name: Frozen graph, explicit reviewed patch, no lifecycle hooks
        run: |
          ./tools/npm ci --ignore-scripts --no-audit --no-fund
          ./tools/npm --prefix src/hackerrank-evidence ci --ignore-scripts --no-audit --no-fund
          ./tools/npm --prefix src/ybm-collector ci --ignore-scripts --no-audit --no-fund
          ./tools/npm --prefix src/embedded-wallet ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
          ./tools/node tools/embedded-wallet/reviewed-dependencies.mjs --apply
      - name: Pinned public source and isolated Geth image
        run: |
          curl --fail --location --max-time 60 https://api.github.com/repos/reclaimprotocol/attestor-core/tarball/bc36dac3657fc46b79b4ecd545262c32440b05a6 -o /tmp/clear-attestor-source.tgz
          ./tools/node tools/local-attestor-review/prepare.mjs --archive /tmp/clear-attestor-source.tgz
          docker pull ethereum/client-go@sha256:abf3605177f8bdcfce436985a8054cca4ae59256323a4ffb72c56c04f3d1fadd
      - name: Explicit synthetic origin; no actual login, paid AI, or user wallet
        run: |
          CLEAR_SELF_HTTPS_TEST=1 ./tools/node --test tests/hackerrank-evidence/self-attestor-https.test.mjs
          CLEAR_SELF_PAYMENT_TEST=1 ./tools/node --test tests/hackathon-test-vault/e5b/self-attestor-payment.test.mjs
          ./tools/node --test tests/hackerrank-evidence/self-profile.test.mjs
